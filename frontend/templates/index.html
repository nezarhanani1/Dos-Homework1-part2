<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazar.com — Book Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e8e8e8;
      padding: 24px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #e94560;
      letter-spacing: -0.5px;
    }
    header p { color: #a0a0b0; margin-top: 6px; font-size: 0.95rem; }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #e94560;
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    select, input, button {
      font-size: 1rem;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: #fff;
    }
    select { min-width: 220px; cursor: pointer; }
    input { width: 80px; }
    button {
      background: #e94560;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #ff6b6b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid #e94560;
      color: #e94560;
    }
    button.secondary:hover { background: rgba(233,69,96,0.15); }
    .books { display: grid; gap: 10px; margin-top: 14px; }
    .book-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .book-item:hover { border-color: #e94560; }
    .book-item .id { color: #e94560; font-weight: 700; min-width: 28px; }
    .book-item .title { flex: 1; margin: 0 12px; }
    .detail {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      border-left: 4px solid #e94560;
    }
    .detail.show { display: block; }
    .detail dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 16px;
      margin-bottom: 14px;
    }
    .detail dt { color: #a0a0b0; }
    .detail dd { font-weight: 500; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 500;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { background: #2d6a4f; }
    .toast.err { background: #9d0208; }
    .empty { color: #a0a0b0; font-style: italic; padding: 12px 0; }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bazar.com</h1>
      <p>The World's Smallest Book Store — DOS Lab</p>
    </header>

    <section class="card">
      <h2>Search by topic</h2>
      <div class="row">
        <select id="topic">
          <option value="distributed systems">distributed systems</option>
          <option value="undergraduate school">undergraduate school</option>
        </select>
        <button type="button" id="btnSearch">Search</button>
      </div>
      <div class="books" id="bookList">
        <p class="empty">Pick a topic and click Search.</p>
      </div>
    </section>

    <section class="card">
      <h2>Book details & purchase</h2>
      <div class="row">
        <label>Book ID</label>
        <input type="number" id="bookId" min="1" max="4" value="2">
        <button type="button" id="btnInfo" class="secondary">View info</button>
        <button type="button" id="btnBuy">Buy now</button>
      </div>
      <div class="detail" id="detail">
        <dl>
          <dt>Title</dt><dd id="dTitle">—</dd>
          <dt>Topic</dt><dd id="dTopic">—</dd>
          <dt>Quantity</dt><dd id="dQty">—</dd>
          <dt>Price</dt><dd id="dPrice">—</dd>
        </dl>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const bookList = document.getElementById("bookList");
    const detail = document.getElementById("detail");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(msg, ok = true) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className = "toast show " + (ok ? "ok" : "err");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 4000);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw { status: res.status, data };
      return data;
    }

    document.getElementById("btnSearch").onclick = async () => {
      const topic = document.getElementById("topic").value;
      bookList.classList.add("loading");
      try {
        const books = await api("/search/" + encodeURIComponent(topic));
        if (!books.length) {
          bookList.innerHTML = '<p class="empty">No books found.</p>';
          return;
        }
        bookList.innerHTML = books.map(b => `
          <div class="book-item" data-id="${b.id}">
            <span class="id">${b.id}</span>
            <span class="title">${b.title}</span>
            <span>→</span>
          </div>
        `).join("");
        bookList.querySelectorAll(".book-item").forEach(el => {
          el.onclick = () => {
            document.getElementById("bookId").value = el.dataset.id;
            loadInfo(el.dataset.id);
          };
        });
      } catch (e) {
        showToast(e.data?.error || "Search failed", false);
        bookList.innerHTML = '<p class="empty">Error loading books.</p>';
      } finally {
        bookList.classList.remove("loading");
      }
    };

    async function loadInfo(id) {
      try {
        const b = await api("/info/" + id);
        document.getElementById("dTitle").textContent = b.title;
        document.getElementById("dTopic").textContent = b.topic;
        document.getElementById("dQty").textContent = b.quantity;
        document.getElementById("dPrice").textContent = "$" + b.price;
        detail.classList.add("show");
      } catch (e) {
        detail.classList.remove("show");
        showToast(e.data?.error || e.data?.message || "Book not found", false);
      }
    }

    document.getElementById("btnInfo").onclick = () =>
      loadInfo(document.getElementById("bookId").value);

    document.getElementById("btnBuy").onclick = async () => {
      const id = document.getElementById("bookId").value;
      const btn = document.getElementById("btnBuy");
      btn.disabled = true;
      try {
        const res = await api("/purchase/" + id, { method: "POST" });
        showToast(res.message || "Purchase successful!", true);
        loadInfo(id);
      } catch (e) {
        const msg = e.data?.message || e.data?.error || "Purchase failed";
        showToast(msg, false);
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById("btnSearch").click();
  </script>
</body>
</html>
