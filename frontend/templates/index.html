<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazar.com — Lab 2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh; color: #e8e8e8; padding: 20px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; color: #e94560; }
    header p { color: #a0a0b0; margin-top: 6px; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .card h2 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
      color: #e94560; margin-bottom: 12px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    select, input, button {
      font-size: 0.95rem; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25); color: #fff;
    }
    button { background: #e94560; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #ff6b6b; }
    button.secondary { background: transparent; border: 1px solid #e94560; color: #e94560; }
    button.warn { background: #9d0208; }
    .health-grid { display: grid; gap: 6px; font-size: 0.85rem; }
    .health-ok { color: #52b788; }
    .health-down { color: #e94560; }
    .books { display: grid; gap: 8px; margin-top: 10px; max-height: 180px; overflow-y: auto; }
    .book-item {
      padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;
      cursor: pointer; border: 1px solid transparent;
    }
    .book-item:hover { border-color: #e94560; }
    pre {
      background: rgba(0,0,0,0.35); padding: 12px; border-radius: 8px;
      font-size: 0.8rem; overflow-x: auto; max-height: 220px; margin-top: 10px;
      white-space: pre-wrap; word-break: break-word;
    }
    .meta { font-size: 0.85rem; color: #a0a0b0; margin-top: 8px; }
    .meta span { color: #e94560; margin-right: 12px; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 12px 18px;
      border-radius: 8px; font-weight: 500; z-index: 100;
      transform: translateY(80px); opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok { background: #2d6a4f; }
    .toast.err { background: #9d0208; }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Bazar.com — Lab 2</h1>
      <p>Replication · Caching · Load Balancing · Consistency</p>
    </header>

    <section class="card">
      <h2>Service Health</h2>
      <button type="button" id="btnHealth">Check all services</button>
      <div class="health-grid" id="healthGrid">Click to check replicas…</div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Search Books</h2>
        <div class="row">
          <select id="topic">
            <option value="distributed systems">distributed systems</option>
            <option value="undergraduate school">undergraduate school</option>
            <option value="theory">theory</option>
            <option value="spring">spring</option>
          </select>
          <button type="button" id="btnSearch">Search</button>
        </div>
        <div class="books" id="bookList"></div>
      </section>

      <section class="card">
        <h2>Book Info & Purchase</h2>
        <div class="row">
          <label>ID</label>
          <input type="number" id="bookId" min="1" max="7" value="2" style="width:70px">
          <button type="button" id="btnInfo" class="secondary">Info</button>
          <button type="button" id="btnBuy">Purchase</button>
        </div>
        <pre id="infoOut">—</pre>
      </section>
    </div>

    <section class="card">
      <h2>Cache Controls</h2>
      <div class="row">
        <button type="button" id="btnCacheStatus" class="secondary">Cache status</button>
        <button type="button" id="btnCacheClear" class="warn">Clear cache</button>
        <button type="button" id="btnCacheInv" class="secondary">Invalidate item</button>
      </div>
    </section>

    <section class="card">
      <h2>Results (JSON + metadata)</h2>
      <div class="meta" id="metaBar"></div>
      <pre id="resultOut">Run an action to see response…</pre>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const resultOut = document.getElementById("resultOut");
    const metaBar = document.getElementById("metaBar");
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(msg, ok = true) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className = "toast show " + (ok ? "ok" : "err");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
    }

    function showResult(data, res) {
      resultOut.textContent = JSON.stringify(data, null, 2);
      const served = res?.headers?.get("X-Served-By") || data?.served_by || "—";
      const cache = res?.headers?.get("X-Cache") || data?.cache || "—";
      metaBar.innerHTML =
        `<span>served_by: ${served}</span><span>cache: ${cache}</span>`;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw { status: res.status, data, res };
      return { data, res };
    }

    document.getElementById("btnHealth").onclick = async () => {
      const grid = document.getElementById("healthGrid");
      grid.textContent = "Checking…";
      try {
        const { data } = await api("/proxy/health/all");
        grid.innerHTML = Object.entries(data).map(([k, v]) => {
          const ok = v.status === "ok" || k === "frontend";
          const label = v.replica || k;
          return `<div class="${ok ? "health-ok" : "health-down"}">${label}: ${v.status || "ok"}</div>`;
        }).join("");
        showResult(data, null);
      } catch (e) {
        grid.innerHTML = '<div class="health-down">Health check failed</div>';
      }
    };

    document.getElementById("btnSearch").onclick = async () => {
      const topic = document.getElementById("topic").value;
      const list = document.getElementById("bookList");
      list.classList.add("loading");
      try {
        const res = await fetch("/search/" + encodeURIComponent(topic));
        const data = await res.json();
        showResult(data, res);
        if (!Array.isArray(data) || !data.length) {
          list.innerHTML = "<p>No books.</p>";
          return;
        }
        list.innerHTML = data.map(b =>
          `<div class="book-item" data-id="${b.id}"><b>${b.id}</b> — ${b.title}</div>`
        ).join("");
        list.querySelectorAll(".book-item").forEach(el => {
          el.onclick = () => {
            document.getElementById("bookId").value = el.dataset.id;
            document.getElementById("btnInfo").click();
          };
        });
      } catch (e) {
        showToast("Search failed", false);
      } finally {
        list.classList.remove("loading");
      }
    };

    document.getElementById("btnInfo").onclick = async () => {
      const id = document.getElementById("bookId").value;
      try {
        const res = await fetch("/info/" + id);
        const data = await res.json();
        document.getElementById("infoOut").textContent = JSON.stringify(data, null, 2);
        showResult(data, res);
      } catch (e) {
        showToast("Info failed", false);
      }
    };

    document.getElementById("btnBuy").onclick = async () => {
      const id = document.getElementById("bookId").value;
      try {
        const res = await fetch("/purchase/" + id, { method: "POST" });
        const data = await res.json();
        showResult(data, res);
        if (data.success) showToast(data.message, true);
        else showToast(data.message || data.error, false);
        document.getElementById("btnInfo").click();
      } catch (e) {
        showToast(e.data?.message || "Purchase failed", false);
      }
    };

    document.getElementById("btnCacheStatus").onclick = async () => {
      const { data } = await api("/cache/status");
      showResult(data, null);
    };

    document.getElementById("btnCacheClear").onclick = async () => {
      const res = await fetch("/cache/clear", { method: "DELETE" });
      const data = await res.json();
      showResult(data, res);
      showToast("Cache cleared", true);
    };

    document.getElementById("btnCacheInv").onclick = async () => {
      const id = document.getElementById("bookId").value;
      const res = await fetch("/cache/invalidate/" + id, { method: "DELETE" });
      const data = await res.json();
      showResult(data, res);
      showToast("Invalidated item " + id, true);
    };
  </script>
</body>
</html>
